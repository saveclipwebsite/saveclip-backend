services:
  - type: web
    name: saveclip-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn main.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://YOUR-FRONTEND-DOMAIN"
      - key: RATE_LIMIT
        value: "30/min"
